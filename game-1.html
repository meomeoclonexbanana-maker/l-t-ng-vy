<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sâu Ăn Lá</title>
<style>
  :root{
    --leaf-dark:#1f3d2b;
    --leaf-mid:#2f5c3f;
    --leaf-light:#6fae66;
    --soil:#3a2a1e;
    --cream:#f2ead6;
    --berry:#d1495b;
    --gold:#e8b84b;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:radial-gradient(circle at 50% 0%,#2a4d33,#132015 75%);
    font-family:'Georgia',ui-serif,serif;
    color:var(--cream);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .wrap{
    display:flex;flex-direction:column;align-items:center;
    min-height:100dvh;
    padding:14px 10px 20px;
  }
  h1{
    font-size:1.5rem;
    letter-spacing:0.5px;
    margin:6px 0 2px;
    font-weight:700;
    color:var(--gold);
    text-shadow:0 2px 0 rgba(0,0,0,0.35);
  }
  .sub{
    font-size:0.8rem;
    color:#bcd6b6;
    margin-bottom:10px;
    text-align:center;
  }
  .hud{
    display:flex;
    justify-content:space-between;
    width:min(94vw,420px);
    margin-bottom:8px;
    font-size:0.95rem;
  }
  .hud span.label{color:#9fc49a;font-size:0.72rem;display:block;letter-spacing:0.3px;}
  .hud .val{font-size:1.15rem;color:var(--cream);font-weight:700;}
  .board-holder{
    position:relative;
    border-radius:18px;
    padding:10px;
    background:linear-gradient(160deg,#4a3728,#2a1e15);
    box-shadow:0 10px 30px rgba(0,0,0,0.45), inset 0 0 0 2px rgba(232,184,75,0.25);
  }
  canvas{
    display:block;
    border-radius:10px;
    background:repeating-linear-gradient(45deg,var(--leaf-dark) 0 20px,var(--leaf-mid) 20px 40px);
    touch-action:none;
    max-width:94vw;
    max-height:58vh;
  }
  .overlay{
    position:absolute;inset:10px;
    border-radius:10px;
    background:rgba(15,25,15,0.82);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:20px;
    gap:10px;
  }
  .overlay.hidden{display:none;}
  .overlay h2{margin:0;color:var(--gold);font-size:1.4rem;}
  .overlay p{margin:0;color:var(--cream);font-size:0.9rem;max-width:280px;line-height:1.4;}
  button{
    font-family:inherit;
    font-size:1rem;
    padding:11px 26px;
    border-radius:999px;
    border:none;
    background:linear-gradient(180deg,var(--gold),#c8932f);
    color:#2a1e0e;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 0 #8a6420, 0 8px 16px rgba(0,0,0,0.3);
    transition:transform 0.08s ease;
  }
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6420;}
  .controls{
    margin-top:16px;
    display:grid;
    grid-template-columns:repeat(3,56px);
    grid-template-rows:repeat(3,56px);
    gap:6px;
  }
  .ctl-btn{
    background:rgba(232,184,75,0.14);
    border:1px solid rgba(232,184,75,0.4);
    border-radius:12px;
    color:var(--cream);
    font-size:1.4rem;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .ctl-btn:active{background:rgba(232,184,75,0.35);}
  .ctl-empty{visibility:hidden;}
  .hint{font-size:0.72rem;color:#8fae8a;margin-top:10px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐛 Sâu Ăn Lá</h1>
  <div class="sub">Vuốt hoặc bấm nút để dẫn sâu ăn lá vàng, tránh đụng thân và viền vườn</div>

  <div class="hud">
    <div>
      <span class="label">ĐIỂM</span>
      <span class="val" id="score">0</span>
    </div>
    <div>
      <span class="label">KỶ LỤC</span>
      <span class="val" id="best">0</span>
    </div>
  </div>

  <div class="board-holder">
    <canvas id="board" width="320" height="320"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Sẵn sàng chưa?</h2>
      <p id="overlayText">Ăn càng nhiều lá vàng, sâu càng dài. Đừng tự cắn đuôi mình nhé!</p>
      <button id="startBtn">Bắt đầu</button>
    </div>
  </div>

  <div class="controls" id="controls">
    <div class="ctl-empty"></div>
    <div class="ctl-btn" data-dir="up">▲</div>
    <div class="ctl-empty"></div>
    <div class="ctl-btn" data-dir="left">◀</div>
    <div class="ctl-empty"></div>
    <div class="ctl-btn" data-dir="right">▶</div>
    <div class="ctl-empty"></div>
    <div class="ctl-btn" data-dir="down">▼</div>
    <div class="ctl-empty"></div>
  </div>
  <div class="hint">Vuốt trên bảng cũng điều khiển được sâu</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const GRID = 16;
  let CELL = canvas.width / GRID;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');

  let best = parseInt(localStorage.getItem('sau-an-la-best') || '0', 10);
  bestEl.textContent = best;

  let snake, dir, nextDir, food, score, alive, loopId, speed;

  function resetGame(){
    snake = [
      {x:8,y:8},{x:7,y:8},{x:6,y:8}
    ];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    speed = 200;
    alive = true;
    placeFood();
    scoreEl.textContent = score;
  }

  function placeFood(){
    let ok=false;
    while(!ok){
      const fx = Math.floor(Math.random()*GRID);
      const fy = Math.floor(Math.random()*GRID);
      ok = !snake.some(s=>s.x===fx&&s.y===fy);
      if(ok) food = {x:fx,y:fy};
    }
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // subtle grid dots
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    for(let i=0;i<GRID;i++){
      for(let j=0;j<GRID;j++){
        if((i+j)%2===0){
          ctx.fillRect(i*CELL,j*CELL,CELL,CELL);
        }
      }
    }

    // food (golden leaf)
    const fx = food.x*CELL+CELL/2, fy = food.y*CELL+CELL/2;
    ctx.save();
    ctx.translate(fx,fy);
    ctx.rotate(Math.PI/4);
    ctx.fillStyle = '#e8b84b';
    ctx.beginPath();
    ctx.ellipse(0,0,CELL*0.42,CELL*0.28,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#a97b1f';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(-CELL*0.4,0);
    ctx.lineTo(CELL*0.4,0);
    ctx.stroke();
    ctx.restore();

    // snake
    snake.forEach((seg,i)=>{
      const x = seg.x*CELL, y = seg.y*CELL;
      const isHead = i===0;
      ctx.fillStyle = isHead ? '#8fd67f' : (i%2===0 ? '#6fae66' : '#5f9c58');
      roundRect(x+1.5,y+1.5,CELL-3,CELL-3, CELL*0.32);
      ctx.fill();
      if(isHead){
        ctx.fillStyle = '#1f2b1a';
        const eyeOffX = dir.x!==0 ? dir.x*CELL*0.18 : CELL*0.18;
        const eyeOffY = dir.y!==0 ? dir.y*CELL*0.18 : -CELL*0.05;
        ctx.beginPath();
        ctx.arc(x+CELL/2+eyeOffX-3, y+CELL/2+eyeOffY-3, 1.6,0,Math.PI*2);
        ctx.arc(x+CELL/2+eyeOffX+3, y+CELL/2+eyeOffY+3, 1.6,0,Math.PI*2);
        ctx.fill();
      }
    });
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function step(){
    if(!alive) return;
    dir = nextDir;
    const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};

    if(head.x<0||head.x>=GRID||head.y<0||head.y>=GRID||snake.some(s=>s.x===head.x&&s.y===head.y)){
      return gameOver();
    }

    snake.unshift(head);

    if(head.x===food.x && head.y===food.y){
      score++;
      scoreEl.textContent = score;
      placeFood();
      if(speed>110) speed -= 1.5;
      restartLoop();
    } else {
      snake.pop();
    }
    draw();
  }

  function restartLoop(){
    clearInterval(loopId);
    loopId = setInterval(step, speed);
  }

  function gameOver(){
    alive = false;
    clearInterval(loopId);
    if(score>best){
      best = score;
      localStorage.setItem('sau-an-la-best', String(best));
      bestEl.textContent = best;
    }
    overlayTitle.textContent = 'Sâu đã dừng lại!';
    overlayText.textContent = 'Bạn được ' + score + ' điểm. Ăn thêm lá vàng để phá kỷ lục ' + best + '.';
    startBtn.textContent = 'Chơi lại';
    overlay.classList.remove('hidden');
  }

  function startGame(){
    overlay.classList.add('hidden');
    resetGame();
    draw();
    restartLoop();
  }

  startBtn.addEventListener('click', startGame);

  function setDir(dx,dy){
    if(!alive) return;
    if(dir.x===-dx && dir.y===-dy) return;
    if(dir.x===dx && dir.y===dy) return;
    nextDir = {x:dx,y:dy};
  }

  window.addEventListener('keydown',(e)=>{
    switch(e.key){
      case 'ArrowUp': case 'w': setDir(0,-1); break;
      case 'ArrowDown': case 's': setDir(0,1); break;
      case 'ArrowLeft': case 'a': setDir(-1,0); break;
      case 'ArrowRight': case 'd': setDir(1,0); break;
    }
  });

  document.getElementById('controls').addEventListener('click',(e)=>{
    const btn = e.target.closest('.ctl-btn');
    if(!btn) return;
    const d = btn.dataset.dir;
    if(d==='up') setDir(0,-1);
    if(d==='down') setDir(0,1);
    if(d==='left') setDir(-1,0);
    if(d==='right') setDir(1,0);
  });

  // swipe controls
  let touchStart = null;
  canvas.addEventListener('touchstart',(e)=>{
    const t = e.touches[0];
    touchStart = {x:t.clientX,y:t.clientY};
  },{passive:true});
  canvas.addEventListener('touchend',(e)=>{
    if(!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if(Math.abs(dx)<20 && Math.abs(dy)<20) return;
    if(Math.abs(dx)>Math.abs(dy)){
      setDir(dx>0?1:-1, 0);
    } else {
      setDir(0, dy>0?1:-1);
    }
    touchStart=null;
  },{passive:true});

  resetGame();
  draw();
})();
</script>
</body>
</html>
